apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lab
  namespace: traefik
spec:
  secretName: wildcard-lab-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging # can be switched to letsencrypt-prod, once cluster is running properly
  dnsNames:
    - "*.lab.caesarlabs.org"
